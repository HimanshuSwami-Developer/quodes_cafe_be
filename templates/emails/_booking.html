<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:18px 0;border:1px solid #D9E1F2;border-radius:12px;border-collapse:separate;font-size:14px">
  <tr><td style="padding:10px 14px;background:#F6F8FD;border-radius:12px 12px 0 0;font-size:11px;letter-spacing:1.5px;font-weight:800;color:#5B6788">BOOKING {{ b.code }}</td></tr>
  <tr><td style="padding:12px 14px;line-height:1.7">
    <b>{{ b.game.name }}</b><br>
    {{ b.date_label }} · {{ b.time_label }}<br>
    {{ b.station_label }} · {{ b.seats.count }} player{{ b.seats.count|pluralize }}<br>
    Amount: <b>₹{{ b.amount_due|floatformat:"0" }}</b>
  </td></tr>
</table>
